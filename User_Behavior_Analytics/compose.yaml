services:
  app:
    depends_on:
      db:
        condition: service_healthy
    image: uba:test
    build: .
    ports:
      - "8000:8000"
    environment:
      UVICORN_RELOAD: "true"
      db_host: db
      db_user: ${POSTGRES_USER:-postgres}
      db_pass: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      db_name: ${POSTGRES_DB:-uba}
    
  
  db:
    image: postgres:17
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-uba}"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-uba}
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: